apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lab-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lab-api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10 # Scale dès que la conso dépasse 5m (10% de 50m)
