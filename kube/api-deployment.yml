apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
spec:
  #replicas: 1
  selector:
    matchLabels:
      app: lab-api
  template:
    metadata:
      labels:
        app: lab-api
    spec:
      containers:
        - name: lab-api
          image: localhost:5001/lab-api:v2
          resources:
            requests:
              cpu: "50m" # 5% d'un coeur (très bas pour déclencher le scale facilement)
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "host=postgres-service user=user password=password dbname=pings"
            - name: RUST_LOG
              value: "debug"

          # Le pod est "Alive" si le process répond
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 3

          # Le pod est "Ready" (reçoit du trafic) si la DB est accessible
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: lab-api-service
spec:
  type: NodePort
  selector:
    app: lab-api
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30950
