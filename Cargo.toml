[package]
license = "MIT"
name = "lab-api"
authors = ["Pascal Lombard"]
description = "API REST exemple pour labs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
deadpool-postgres = "0.12" # Pour gérer le pool de connexion simplement
tokio-postgres = { version = "0.7", features = ["with-uuid-1","with-chrono-0_4"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15" # Pour lire le .env en local
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
