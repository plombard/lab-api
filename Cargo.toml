[package]
license = "MIT"
name = "lab-api"
authors = ["Pascal Lombard"]
description = "API REST exemple pour labs"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15" # Pour lire le .env en local
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
